[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aif-insights"
version = "0.1.0.dev0"
description = "Collect, redact and archive AI coding-agent transcripts (Claude Code, Codex) for factory analytics."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "BrainMatterStudios" }]
# Collection, redaction and the local store are stdlib. Codex compresses its
# transcripts with zstd, which the stdlib reads only from Python 3.14.
dependencies = ["zstandard>=0.22; python_version < '3.14'"]

[project.optional-dependencies]
r2 = ["boto3>=1.34"]          # Cloudflare R2 (S3-compatible) store
dev = ["pytest>=7", "ruff==0.16.0"]

[project.scripts]
aif-insights = "aif_insights.cli:main"

[tool.setuptools.packages.find]
include = ["aif_insights*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "PLW", "PLE"]
ignore = ["E501", "PLW1510", "RUF001", "RUF002", "RUF003", "SIM105", "BLE001"]
